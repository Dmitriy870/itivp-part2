apiVersion: 1

contactPoints:
  - orgId: 1
    name: Training Platform Telegram
    receivers:
      - uid: training-platform-telegram
        type: telegram
        disableResolveMessage: false
        settings:
          bottoken: $TELEGRAM_BOT_TOKEN
          chatid: $TELEGRAM_CHAT_ID
          message: |
            {{ template "default.message" . }}

policies:
  - orgId: 1
    receiver: Training Platform Telegram
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
