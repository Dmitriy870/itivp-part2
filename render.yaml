services:
  - type: web
    name: profkurs-kr22-api
    runtime: node
    plan: free
    region: frankfurt
    branch: kr22
    autoDeployTrigger: commit
    buildCommand: npm ci --omit=dev
    startCommand: npm run db:seed -- --if-empty && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: profkurs-kr22-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin-kr22@example.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: MODERATOR_EMAIL
        value: moderator-kr22@example.com
      - key: MODERATOR_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: REFRESH_COOKIE_PATH
        value: /api/auth
      - key: ENABLE_TEST_ENDPOINTS
        value: "false"

databases:
  - name: profkurs-kr22-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []
